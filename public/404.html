<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Wrestle With Jimmy</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root {
        --blue: #0057a8;
        --yellow: #ffd600;
        --white: #ffffff;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem;
        text-align: center;
        background: var(--blue);
        color: var(--white);
        font-family: 'Barlow', system-ui, -apple-system, sans-serif;
      }
      .code {
        font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
        font-size: clamp(5rem, 20vw, 11rem);
        font-weight: 800;
        line-height: 0.9;
        letter-spacing: -0.02em;
      }
      .code span {
        color: var(--yellow);
      }
      h1 {
        font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
        font-size: clamp(1.4rem, 5vw, 2rem);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      p {
        max-width: 34rem;
        font-size: 1rem;
        line-height: 1.6;
        opacity: 0.9;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
        margin-top: 0.75rem;
      }
      a.btn {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-decoration: none;
        padding: 0.75rem 1.4rem;
        border-radius: 4px;
        transition: background 0.15s, color 0.15s;
      }
      .btn-solid {
        background: var(--yellow);
        color: #0f0f1a;
      }
      .btn-solid:hover {
        background: var(--white);
      }
      .btn-outline {
        border: 2px solid var(--white);
        color: var(--white);
      }
      .btn-outline:hover {
        background: var(--white);
        color: var(--blue);
      }
    </style>
  </head>
  <body>
    <p class="code">4<span>0</span>4</p>
    <h1>This page is undone</h1>
    <p>
      Like the sweater song. The page you're after doesn't exist — but the band
      very much does.
    </p>
    <div class="links">
      <a class="btn btn-solid" href="/">Back to the band</a>
      <a class="btn btn-outline" href="/#contact">Book us</a>
    </div>
  </body>
</html>
